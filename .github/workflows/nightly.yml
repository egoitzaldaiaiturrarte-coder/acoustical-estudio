# Tarea programada: validación nocturna de todo el ecosistema Acoustical.
# Cada noche comprueba que las tres plataformas siguen compilando y pasando
# los tests (núcleo DSP compartido, app Android, instalador Windows), para
# detectar cualquier desincronización entre versiones antes de que afecte.
name: Validación nocturna

on:
  schedule:
    - cron: "0 3 * * *"   # diario a las 03:00 UTC
  workflow_dispatch:

# contents: write en el job que llama al reusable (abajo): el workflow
# llamable exige contents:write (publica el Release y empuja a
# ci-diagnostics) y las permissions de un workflow llamable solo pueden
# MANTENERSE o REDUCIRSE respecto a las del llamador: si el llamador diera
# read, la corrida no arrancaría.
permissions:
  contents: write

jobs:
  nocturno:
    # Corrida nocturna del workflow reusable: gate DSP + build de Windows +
    # ASan, sin publicar nada (publish: false) y con el sufijo "nocturno" en
    # los artefactos para distinguirlos de los oficiales.
    #
    # Este job SUSTITUYE al antiguo job "build" de este fichero, que estaba
    # ROTO por dos motivos:
    #   1) Instalaba Inno Setup con choco (que descarga la última version,
    #      i.e. Inno 7, que se instala en otra carpeta) pero el paso
    #      siguiente solo buscaba la ruta "Inno Setup 6".
    #   2) Subía *.exe + *.sha256 con if-no-files-found: error, cuando
    #      NINGÚN paso del job generaba el .sha256.
    # Ahora el pin de Inno 6.7.3, la reescritura de version, la generación del
    # sha256 y los diagnosticos viven en windows-build.yml (compartido con
    # build-windows.yml): el nocturno valida por fin el instalador REAL,
    # exactamente igual que el build oficial.
    uses: $/.github/workflows/windows-build.yml
    with:
      publish: false
      artifact-suffix: "-nocturno"
    # El group del job llamador es distinto del de los jobs del reusable
    # (esos llevan el sufijo "-reusable": en un workflow llamable
    # ${{ github.workflow }} vale el nombre del LLAMADOR, así que si
    # llamador y llamable compartieran exactamente el mismo group, el job
    # llamable cancelaría al llamador nada más arrancar — lo advierte la doc
    # oficial de reusable workflows).
    # Un job llamador no puede llevar timeout-minutes: el timeout de 45 min
    # de los jobs Windows vive en el propio reusable.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

  android:
    # App Android: tests JVM + APK debug como artefacto de control.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: android-acoustical
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Caché de Gradle (~/.gradle: wrapper + dependencias) y de Maven
      # (~/.m2): la key es un hash de los ficheros Gradle del proyecto, así
      # que cualquier cambio en build.gradle.kts/settings.gradle.kts
      # (o en la version del wrapper) invalida la caché automáticamente.
      - name: Caché de Gradle y Maven
        uses: actions/cache@v4
        with:
          # Ojo: hashFiles se resuelve desde la RAIZ del workspace, no desde
          # el working-directory del job (android-acoustical).
          path: |
            ~/.gradle
            ~/.m2
          key: ${{ runner.os }}-gradle-${{ hashFiles('android-acoustical/settings.gradle.kts', 'android-acoustical/build.gradle.kts', 'android-acoustical/app/build.gradle.kts', 'android-acoustical/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Instalar Android SDK components
        run: |
          SDKM="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "platforms;android-36" "build-tools;36.0.0" \
            "ndk;27.0.12077973" "cmake;3.22.1" \
            || echo "Gradle descargará por su cuenta los componentes que falten"

      - name: Configurar local.properties
        run: echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Ejecutar tests JVM (DSP Kotlin)
        run: ./gradlew :app:testDebugUnitTest --console=plain --stacktrace

      - name: Compilar APK (debug)
        run: ./gradlew :app:assembleDebug --console=plain --stacktrace

      - name: Subir el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AcousticalEstudio-Android-nocturno
          path: android-acoustical/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
