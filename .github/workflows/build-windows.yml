# Compila Acoustical Estudio para Windows en la nube: el resultado es el
# instalador listo para ejecutar (sin instalar nada en tu PC).
name: Compilar Acoustical Estudio (Windows)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dsp:
    # Fast gate: compile the shared C DSP core and run the C++ engine + JNI
    # bridge tests on Linux. Catches regressions in the DSP that both the
    # Windows app and the Android native lib depend on, in seconds.
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Compilar y testear el núcleo DSP compartido (C)
        run: |
          g++ -std=c++17 -O2 -Iwindows-acoustical/engine -Idsp \
            dsp/test_engine_wiring.cpp dsp/acoustical_dsp.c \
            windows-acoustical/engine/FftProcessor.cpp windows-acoustical/engine/EqDsp.cpp \
            -o /tmp/test_wiring -lm
          /tmp/test_wiring

      - name: Compilar y testear el puente JNI (sin NDK)
        run: |
          g++ -std=c++17 -O2 -Idsp/jni_stub -Idsp \
            android-acoustical/app/src/main/cpp/acoustical_jni.cpp \
            dsp/acoustical_dsp.c dsp/test_jni.cpp -o /tmp/test_jni -lm
          /tmp/test_jni

      # El camino #ifdef _WIN32 del puente ASIO solo compila en MSVC: se
      # valida aquí contra un windows.h con las firmas reales de las API
      # (pilla typos como UnmapViewOfSection antes del job de Windows).
      - name: Syntax-check del puente ASIO (camino Win32)
        run: |
          g++ -std=c++17 -fsyntax-only \
            -Iwindows-acoustical/tools/fakewin \
            -Iwindows-acoustical/asio-bridge \
            -Iwindows-acoustical/app \
            windows-acoustical/tools/test_winbridge.cpp

      # Filtro de crash (Camino solo-Windows de CrashFilter.h) contra las
      # firmas reales de Win32 (fakewin): pilla typos de API antes del build.
      - name: Syntax-check del filtro de crash (Win32)
        run: |
          g++ -std=c++17 -fsyntax-only -DJUCE_WINDOWS=1 \
            -Iwindows-acoustical/tools/fakewin \
            -Iwindows-acoustical/app \
            windows-acoustical/tools/test_crashfilter.cpp

      # Protocolo del enlace móvil↔PC (SyncClient + BeaconListener) contra un
      # "móvil falso" en loopback: baliza UDP, emparejamiento por código,
      # sync push/pull, HTTP /manifest + /payload con SHA-256. Compila los
      # mismos .cpp que la app de Windows (JUCE directo, sin X11/freetype).
      - name: Test del protocolo Wi-Fi (móvil falso, JUCE)
        run: |
          git clone --quiet --depth 1 --branch 7.0.12 \
            https://github.com/juce-framework/JUCE.git /tmp/juce
          JUCE_DIR=/tmp/juce bash windows-acoustical/tools/build_lantest.sh /tmp/AcousticalLanTest --run

  android:
    # Full Android build: runs the pure-Kotlin DSP unit tests, builds the
    # native libacoustical_dsp.so, and assembles the debug APK.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-acoustical
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK components
        run: |
          SDKM="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "platforms;android-36" "build-tools;36.0.0" \
            "ndk;27.0.12077973" "cmake;3.22.1" \
            || echo "Gradle descargará por su cuenta los componentes que falten"

      - name: Configurar local.properties
        run: echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Ejecutar tests JVM (DSP Kotlin)
        run: ./gradlew :app:testDebugUnitTest --console=plain --stacktrace

      - name: Compilar APK (debug)
        run: ./gradlew :app:assembleDebug --console=plain --stacktrace

      - name: Subir el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AcousticalEstudio-Android
          path: android-acoustical/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-acoustical
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Compilar app, plugin y driver ASIO (x64 + Win32)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools\build_all.ps1

      # El exe + PDB de la app (fuera del instalador): con el offset del crash
      # que anota startup.log se localiza la función/línea exacta en el PDB.
      - name: Subir el binario de la app (exe + PDB)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AcousticalEstudio-Binary
          path: |
            windows-acoustical/dist/app/Acoustical Estudio.exe
            windows-acoustical/dist/app/Acoustical Estudio.pdb
          if-no-files-found: ignore

      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          # Version FIJADA y bajada directa de la release oficial de Inno: no
          # usar choco "latest" porque cambio la version (Inno 7 se instala en
          # otra carpeta) y rompio el build dos veces seguidas.
          $out = @()
          $exit = 0
          try {
              $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
              $installer = Join-Path $env:TEMP "innosetup-6.7.3.exe"
              Write-Host "Descargando Inno Setup 6.7.3 (release oficial)..."
              Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
              $out += (& $installer /S /VERYSILENT /NORESTART 2>&1 | ForEach-Object { "$_" })
              $exit = $LASTEXITCODE
          } catch {
              $exit = 1
              $out += "ERROR: $($_.Exception.Message)"
          }
          $out | ForEach-Object { Write-Host $_ }
          if (Test-Path "inno-install.log") { Remove-Item "inno-install.log" -Force }
          ($out | ForEach-Object { $_ }) | Set-Content "inno-install.log" -Encoding utf8
          $iscc6 = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc6)) {
              throw "Inno Setup 6 no quedo instalado (sin ISCC en '$iscc6') - detalle en el artefacto installer-diagnostics"
          }
          Write-Host "Inno Setup 6.7.3 listo: $iscc6"

      - name: Generar el instalador
        shell: pwsh
        run: |
          # La version del instalador sale de app\CMakeLists.txt (fuente unica
          # de verdad): se reescribe la linea #define AppVersion del .iss.
          $ErrorActionPreference = 'Continue'   # el error se controla a mano; el runner pone 'Stop'
          foreach ($req in @("app\CMakeLists.txt", "installer\acoustical.iss")) {
              if (-not (Test-Path $req)) { throw "Falta el archivo $req (working dir: $PWD)" }
          }
          $cmakeApp = Get-Content "app\CMakeLists.txt" -Raw
          # Grupo de captura (sin \K: el motor regex de .NET de pwsh no lo soporta)
          $m = [regex]::Match($cmakeApp, 'JUCE_APPLICATION_VERSION_STRING\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"')
          if (-not $m.Success) { throw "No se encontro JUCE_APPLICATION_VERSION_STRING en app\CMakeLists.txt" }
          $ver = $m.Groups[1].Value
          Write-Host "Version del instalador: $ver"
          # Reescritura que preserva la codificacion del .iss con BOM UNICO
          # (el archivo original ya trae BOM: se quita antes de volver a escribir)
          $issPath = "installer\acoustical.iss"
          $bytes = [System.IO.File]::ReadAllBytes($issPath)
          $text = [System.Text.Encoding]::UTF8.GetString($bytes)
          if ($text.Length -gt 0 -and $text[0] -eq [char]0xFEFF) { $text = $text.Substring(1) }
          $text = [regex]::Replace($text, '(?m)^#define\s+AppVersion\s+"[^"]*"', ('#define AppVersion "' + $ver + '"'))
          [System.IO.File]::WriteAllText($issPath, $text, (New-Object System.Text.UTF8Encoding($true)))
          Select-String -Path $issPath -Pattern 'AppVersion' | ForEach-Object { Write-Host ("  " + $_.Line.Trim()) }
          # Buscar ISCC: choco instala la ultima Inno (6 o 7, en el directorio
          # que sea); aceptar cualquier una de las ubicaciones conocidas
          $cands = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe"
          )
          $iscc = $cands | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { $g = Get-Command ISCC.exe -ErrorAction SilentlyContinue; if ($g) { $iscc = $g.Source } }
          if (-not $iscc) {
              $cands | ForEach-Object { Write-Host ("  sin ISCC en: " + $_) }
              throw "ISCC.exe no encontrado (Inno Setup 6 o 7)"
          }
          Write-Host ("ISCC: " + $iscc)
          # Compilar; se guarda el output completo para poder leerlo a posteriori
          New-Item -ItemType Directory -Force -Path "dist\installer" | Out-Null
          if (Test-Path "dist\installer\iscc-output.txt") { Remove-Item "dist\installer\iscc-output.txt" -Force }
          $isccOut = & $iscc $issPath 2>&1
          $isccExit = $LASTEXITCODE
          $isccOut | ForEach-Object { Write-Host "$_" }
          ($isccOut | ForEach-Object { "$_" }) | Set-Content "dist\installer\iscc-output.txt" -Encoding utf8
          # Diagnostico: siempre se genera (el siguiente paso lo sube si hay fallo)
          $diag = @("version: $ver", "iscc: $iscc", "iscc_exit: $isccExit")
          $diag += "----- ISCC: ultimas 80 lineas -----"
          $diag += (Get-Content "dist\installer\iscc-output.txt" -Tail 80)
          $diag += "----- contenido de dist\installer -----"
          $diag += (Get-ChildItem "dist\installer" -ErrorAction SilentlyContinue | ForEach-Object { $_.Name })
          $diag | Set-Content "dist\installer\installer-diagnostics.txt" -Encoding utf8
          if ($isccExit -ne 0) {
              throw "ISCC termino con codigo $isccExit — el detalle esta en el artefacto installer-diagnostics"
          }
          # Verificacion: el exe generado debe llamarse con la version correcta
          $expected = "dist\installer\AcousticalEstudioSetup-$ver.exe"
          if (-not (Test-Path $expected)) {
              throw "El instalador no se llama como se esperaba: AcousticalEstudioSetup-$ver.exe (detalle en installer-diagnostics)"
          }
          Write-Host "Instalador OK: $expected"

      - name: Subir diagnosticos del instalador (cualquier resultado)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-diagnostics
          path: |
            windows-acoustical/inno-install.log
            windows-acoustical/dist/installer/installer-diagnostics.txt
            windows-acoustical/dist/installer/iscc-output.txt
          if-no-files-found: ignore

      # Red de seguridad: si el job falla, publica los diagnosticos en la rama
      # ci-diagnostics (se puede leer sin permisos via raw.githubusercontent).
      - name: Publicar diagnosticos en rama ci-diagnostics (si el job fallo)
        if: failure()
        shell: pwsh
        run: |
          $ws = $env:GITHUB_WORKSPACE
          $cands = @(
            "$ws\windows-acoustical\inno-install.log",
            "$ws\windows-acoustical\dist\installer\installer-diagnostics.txt",
            "$ws\windows-acoustical\dist\installer\iscc-output.txt"
          )
          $files = @($cands | Where-Object { Test-Path $_ })
          if ($files.Count -eq 0) {
              # Ningun fichero de diagnostico llego a existir: volcar el estado
              # del disco para saber porque (el fallo ocurrio antes de escribir)
              $state = @(
                "run: $env:GITHUB_RUN_ID / intento $env:GITHUB_RUN_ATTEMPT",
                "ws: $ws",
                "----- listado de $ws -----",
                (Get-ChildItem $ws -Force -ErrorAction SilentlyContinue | ForEach-Object { $_.Name }),
                "----- listado de $ws\windows-acoustical -----",
                (Get-ChildItem "$ws\windows-acoustical" -Force -ErrorAction SilentlyContinue | ForEach-Object { $_.Name })
              )
              $state | Set-Content "$ws\ws-state.txt" -Encoding utf8
              $files += "$ws\ws-state.txt"
          }
          $repo = Join-Path $env:RUNNER_TEMP "diag-push"
          git clone --quiet --depth 1 "https://x-access-token:${env:GITHUB_TOKEN}@github.com/${env:GITHUB_REPOSITORY}.git" $repo
          foreach ($f in $files) {
              Copy-Item $f (Join-Path $repo (Split-Path $f -Leaf)) -Force
          }
          Set-Location $repo
          git config user.email "ci-diagnostics@acoustical.local"
          git config user.name "CI Diagnostics"
          git checkout -B ci-diagnostics
          git add -A
          git commit -m "diagnostico build run $env:GITHUB_RUN_ID ($(Get-Date -Format 'yyyyMMdd-HHmmss'))"
          git push --force --quiet origin ci-diagnostics
          Write-Host "Diagnosticos publicados en la rama ci-diagnostics"

      - name: Calcular SHA-256 del instalador
        shell: pwsh
        run: |
          $exe = Get-ChildItem "dist\installer\*.exe" | Select-Object -First 1
          if (-not $exe) { throw "No se generó el instalador" }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File "$($exe.FullName).sha256" -Encoding ascii
          Write-Host "SHA-256: $hash"

      - name: Subir el instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AcousticalEstudioSetup
          path: |
            windows-acoustical/dist/installer/*.exe
            windows-acoustical/dist/installer/*.sha256
          if-no-files-found: error

      - name: Publicar en Releases (solo al crear una etiqueta vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows-acoustical/dist/installer/*.exe
            windows-acoustical/dist/installer/*.sha256
