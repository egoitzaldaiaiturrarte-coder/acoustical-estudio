# Compila Acoustical Estudio para Windows en la nube: el resultado es el
# instalador listo para ejecutar (sin instalar nada en tu PC).
#
# TRIGGERS:
#   - workflow_dispatch: corrida manual desde la pestaña Actions.
#   - push de una tag v*: build OFICIAL — publica el instalador (y el
#     binario ASan) en un GitHub Release.
#   - pull_request: SOLO corre el gate del núcleo DSP (Linux, barato).
#     El build de Windows NO corre en PRs a propósito: cada PR gastaría un
#     runner de Windows (los más escasos y caros) para un build que ya
#     validan el gate dsp, el nocturno diario y la tag; los PRs reciben
#     solo el feedback rápido del núcleo.
#
# El build de Windows (app + plugin + driver + instalador Inno 6.7.3 fijo +
# sha256) y el gate DSP canónico están definidos UNA sola vez en el
# workflow reusable windows-build.yml (compartido con nightly.yml): este
# fichero solo decide CUÁNDO y CON QUÉ PARÁMETROS se llama.
name: Compilar Acoustical Estudio (Windows)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  dsp-gate:
    # Solo en PRs: llama al reusable pidiendo SOLO el gate DSP de Linux
    # (run-windows-build: false). En dispatch/tags este job se salta y el
    # gate corre dentro del job "windows" (misma definición canónica).
    #
    # Ojo: un job que llama a un reusable solo puede llevar las claves
    # name/uses/with/secrets/strategy/needs/if/concurrency/permissions
    # (sin runs-on, steps ni timeout-minutes): los limites de tiempo y
    # cancelación se fijan en los jobs del propio reusable.
    if: github.event_name == 'pull_request'
    uses: $/.github/workflows/windows-build.yml
    with:
      run-windows-build: false
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

  windows:
    # Build oficial (dispatch + tags v*): llama al reusable con
    # publish: true. La publicación en el Release está además condicionada
    # al tag (un dispatch manual con publish: true no publica nada).
    # El gate DSP canónico corre aquí en la misma llamada (job dsp del
    # reusable), así tags y dispatch validan el núcleo y el instalador.
    # Mismas restricciones que el job de arriba (un job llamador no puede
    # llevar timeout-minutes: el timeout vive en el job build del reusable).
    if: github.event_name != 'pull_request'
    uses: $/.github/workflows/windows-build.yml
    with:
      publish: true
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

  android:
    # Full Android build: runs the pure-Kotlin DSP unit tests, builds the
    # native libacoustical_dsp.so, and assembles the debug APK.
    # No corre en PRs (mismo razonamiento que el job "windows": los PRs
    # solo reciben el gate DSP barato).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: android-acoustical
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Caché de Gradle (~/.gradle: wrapper + dependencias) y de Maven
      # (~/.m2): la key es un hash de los ficheros Gradle del proyecto, así
      # que cualquier cambio en build.gradle.kts/settings.gradle.kts
      # (o en la version del wrapper) invalida la caché automáticamente.
      - name: Caché de Gradle y Maven
        uses: actions/cache@v4
        with:
          # Ojo: hashFiles se resuelve desde la RAIZ del workspace, no desde
          # el working-directory del job (android-acoustical).
          path: |
            ~/.gradle
            ~/.m2
          key: ${{ runner.os }}-gradle-${{ hashFiles('android-acoustical/settings.gradle.kts', 'android-acoustical/build.gradle.kts', 'android-acoustical/app/build.gradle.kts', 'android-acoustical/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Instalar Android SDK components
        run: |
          SDKM="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "platforms;android-36" "build-tools;36.0.0" \
            "ndk;27.0.12077973" "cmake;3.22.1" \
            || echo "Gradle descargará por su cuenta los componentes que falten"

      - name: Configurar local.properties
        run: echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Ejecutar tests JVM (DSP Kotlin)
        run: ./gradlew :app:testDebugUnitTest --console=plain --stacktrace

      - name: Compilar APK (debug)
        run: ./gradlew :app:assembleDebug --console=plain --stacktrace

      - name: Subir el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AcousticalEstudio-Android
          path: android-acoustical/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
